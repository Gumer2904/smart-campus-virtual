services:
  # ==========================================
  # BASE DE DATOS - PostgreSQL 16
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: smartcampus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartcampus_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # BACKEND - FastAPI
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartcampus_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - smartcampus_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ==========================================
  # PgADMIN - Interfaz visual para PostgreSQL
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartcampus_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartcampus.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - smartcampus_net

volumes:
  postgres_data:
    driver: local

networks:
  smartcampus_net:
    driver: bridge